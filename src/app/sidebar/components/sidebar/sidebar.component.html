@if (isAuthenticated()) {
<div class="custom-menu" [@slideFromLeft]="isOpen() ? 'visible' : 'hidden'">
    <div class="menu-header">
        <h1>Challenges</h1>
        <button class="close-button" (click)="toggleSidebar()" aria-label="Fechar menu">
            <img src="./assets/close-icon.svg" alt="Fechar" />
        </button>
    </div>
    <nav>
        <a
            class="item"
            [routerLink]="['challenges', 'tip-calculator']"
            [routerLinkActive]="'active'"
            (click)="toggleSidebar()"
            >Tip Calculator</a
        >
        <a
            class="item"
            [routerLink]="['challenges', 'columns-preview-card']"
            [routerLinkActive]="'active'"
            (click)="toggleSidebar()"
            >3 Column Preview Card</a
        >
        <a
            class="item"
            [routerLink]="['challenges', 'order-summary']"
            [routerLinkActive]="'active'"
            (click)="toggleSidebar()"
            >Order Summary</a
        >
        <a
            class="item"
            [routerLink]="['challenges', 'time-tracking-dashboard']"
            [routerLinkActive]="'active'"
            (click)="toggleSidebar()"
            >Time Tracking Dashboard</a
        >
        <a class="item" [routerLink]="['challenges', 'todo']" [routerLinkActive]="'active'" (click)="toggleSidebar()"
            >Todo List</a
        >
        <a
            class="item"
            [routerLink]="['challenges', 'countdown-timer']"
            [routerLinkActive]="'active'"
            (click)="toggleSidebar()"
            >Countdown Timer</a
        >
        <a
            class="item"
            [routerLink]="['challenges', 'rock-paper-scissors']"
            [routerLinkActive]="'active'"
            (click)="toggleSidebar()"
            >Rock Paper Scissors</a
        >
        <a
            class="item"
            [routerLink]="['challenges', 'product-list']"
            [routerLinkActive]="'active'"
            (click)="toggleSidebar()"
            >Products</a
        >
    </nav>
    <div class="menu-footer">
        <button class="logout-button" (click)="showLogoutConfirm.set(true)" [class.loading]="isLoggingOut()">
            <img src="./assets/logout-icon.svg" alt="Sair" class="logout-icon" />
            Sair
        </button>

        @if (showLogoutConfirm()) {
            <div class="logout-modal">
                <div class="modal-content">
                    <h3>Confirmar Saída</h3>
                    <p>Tem certeza que deseja sair?</p>
                    <div class="modal-actions">
                        <button class="cancel-button" (click)="cancelLogout()">
                            Cancelar
                        </button>
                        <button class="confirm-button" (click)="logout()">
                            Confirmar
                        </button>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
}

@if (isOpen() && isAuthenticated()) {
    <div
        class="sidebar overlay"
        @overlayAppear
        (click)="toggleSidebar()"
        (keyup.enter)="toggleSidebar()"
        tabindex="0"
    ></div>
}
